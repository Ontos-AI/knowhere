name: Build and deploy API services

on:
  push:
    branches:
      - staging
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      service:
        description: Service to build
        required: false
        type: choice
        options:
          - all
          - api
          - worker
      deployment_target:
        description: Staging deployment target
        required: false
        type: choice
        default: ecs-staging
        options:
          - ecs-staging
          - eks-staging-rollback

env:
  ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
  ECR_REGISTRY: 107424103509.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: knowhere
  AWS_EKS_PROD_CLUSTER_NAME: ${{ secrets.AWS_EKS_PROD_CLUSTER_NAME }}
  AWS_EKS_PROD_REGION: ${{ secrets.AWS_EKS_PROD_REGION }}
  AWS_ECS_STAGING_CLUSTER_NAME: knowhere-fargate
  AWS_ECS_STAGING_REGION: us-east-1
  AWS_ECS_STAGING_EXECUTION_ROLE_ARN: arn:aws:iam::107424103509:role/knowhere-fargate-staging-execution-role
  AWS_ECS_STAGING_API_TASK_ROLE_ARN: arn:aws:iam::107424103509:role/knowhere-api-staging-task-role
  AWS_ECS_STAGING_WORKER_TASK_ROLE_ARN: arn:aws:iam::107424103509:role/knowhere-worker-staging-task-role
  AWS_ECS_STAGING_SECRETS_ARN: ${{ secrets.AWS_ECS_STAGING_SECRETS_ARN }}
  AWS_ECS_STAGING_API_SERVICE_NAME: knowhere-api-staging
  AWS_ECS_STAGING_WORKER_SERVICE_NAME: knowhere-worker-staging

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        service: [api, worker]
        include:
          - service: api
            dockerfile: deploy/docker/Dockerfile.api
            image_name: knowhere-backend
            ecr_repo_name: knowhere-backend
          - service: worker
            dockerfile: deploy/docker/Dockerfile.worker
            image_name: knowhere-worker
            ecr_repo_name: knowhere-worker

    steps:
      - name: Validate semantic release tag
        if: ${{ github.event_name == 'release' }}
        shell: bash
        run: |
          release_tag="${{ github.event.release.tag_name }}"
          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'

          if [[ ! "$release_tag" =~ $semver_pattern ]]; then
            echo "::error::Knowhere API releases must use semantic version tags like v1.0.1. Date-based tags such as 2026.06.18.1 or v2026.06.18.1 are not supported."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Decide build context
        id: context
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            environment="staging"
          elif [ "${{ github.event_name }}" = "release" ]; then
            environment="prod"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            environment="prod"
          else
            environment="staging"
          fi

          should_push="true"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.deployment_target }}" != "ecs-staging" ] && [ -n "${{ github.event.inputs.service }}" ] && [ "${{ github.event.inputs.service }}" != "all" ] && [ "${{ github.event.inputs.service }}" != "${{ matrix.service }}" ]; then
            should_build="false"
          else
            should_build="true"
          fi

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "should_push=$should_push" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

      - name: Generate image tags
        if: steps.context.outputs.should_build == 'true'
        id: tags
        shell: bash
        run: |
          environment="${{ steps.context.outputs.environment }}"
          short_sha="${GITHUB_SHA::8}"

          if [ "${{ github.event_name }}" = "release" ]; then
            git_tag="${{ github.event.release.tag_name }}"
            image_tag="${git_tag}-${environment}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            git_tag="${GITHUB_REF#refs/tags/}"
            image_tag="${git_tag}-${environment}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            image_tag="pr-${{ github.event.pull_request.number }}-${short_sha}"
          else
            image_tag="${environment}-${short_sha}"
          fi

          latest_tag="${environment}-latest"

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Prepare registry tags
        if: steps.context.outputs.should_build == 'true'
        id: images
        shell: bash
        run: |
          image_name="$(echo "${{ matrix.image_name }}" | tr '[:upper:]' '[:lower:]')"
          image_tag="${{ steps.tags.outputs.image_tag }}"
          latest_tag="${{ steps.tags.outputs.latest_tag }}"

          echo "local_image=${image_name}:${image_tag}" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.context.outputs.should_push }}" = "true" ] && \
             [ -n "${{ env.ACR_REGISTRY }}" ] && \
             [ -n "${{ env.ACR_NAMESPACE }}" ] && \
             [ -n "${{ secrets.ALIYUN_ACR_USERNAME }}" ] && \
             [ -n "${{ secrets.ALIYUN_ACR_PASSWORD }}" ]; then
            acr_namespace="$(echo "${{ env.ACR_NAMESPACE }}" | tr '[:upper:]' '[:lower:]')"
            echo "acr_image=${{ env.ACR_REGISTRY }}/${acr_namespace}/${image_name}:${image_tag}" >> "$GITHUB_OUTPUT"
            echo "acr_latest=${{ env.ACR_REGISTRY }}/${acr_namespace}/${image_name}:${latest_tag}" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ steps.context.outputs.should_push }}" = "true" ] && \
             [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && \
             [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "ecr_image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}/${{ matrix.ecr_repo_name }}:${image_tag}" >> "$GITHUB_OUTPUT"
            echo "ecr_latest=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}/${{ matrix.ecr_repo_name }}:${latest_tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build tag list
        if: steps.context.outputs.should_build == 'true'
        id: tag-list
        shell: bash
        run: |
          {
            echo 'tags<<EOF'

            if [ "${{ steps.context.outputs.should_push }}" != "true" ]; then
              echo "${{ steps.images.outputs.local_image }}"
            fi

            if [ -n "${{ steps.images.outputs.acr_image }}" ]; then
              echo "${{ steps.images.outputs.acr_image }}"
              echo "${{ steps.images.outputs.acr_latest }}"
            fi

            if [ -n "${{ steps.images.outputs.ecr_image }}" ]; then
              echo "${{ steps.images.outputs.ecr_image }}"
              echo "${{ steps.images.outputs.ecr_latest }}"
            fi

            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.context.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        if: steps.context.outputs.should_build == 'true' && steps.images.outputs.acr_image != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Configure AWS credentials
        if: steps.context.outputs.should_build == 'true' && steps.images.outputs.ecr_image != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        if: steps.context.outputs.should_build == 'true' && steps.images.outputs.ecr_image != ''
        shell: bash
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build image
        if: steps.context.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.context.outputs.should_push == 'true' }}
          tags: ${{ steps.tag-list.outputs.tags }}
          build-args: |
            ENVIRONMENT=${{ steps.context.outputs.environment }}
            APP_VERSION=${{ steps.tags.outputs.image_tag }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize build
        if: steps.context.outputs.should_build == 'true'
        shell: bash
        run: |
          echo "Service: ${{ matrix.service }}"
          echo "Environment: ${{ steps.context.outputs.environment }}"
          echo "Push enabled: ${{ steps.context.outputs.should_push }}"
          echo "Primary tag: ${{ steps.tags.outputs.image_tag }}"

  migrate-ecs-staging:
    name: Run staging Neon database migration
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: >-
      ${{ (github.ref == 'refs/heads/staging' ||
      github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_dispatch' ||
      github.event.inputs.deployment_target == 'ecs-staging') &&
      (github.event_name != 'workflow_dispatch' ||
      github.event.inputs.service == '' ||
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'api') }}
    permissions:
      contents: read

    steps:
      - name: Validate migration configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "::error::Staging Neon migration requires AWS ECR credentials."
            exit 1
          fi
          if [ -z "${{ secrets.STAGING_MIGRATION_DATABASE_URL }}" ]; then
            echo "::error::STAGING_MIGRATION_DATABASE_URL is not configured. Add the direct Neon migration-role URL before the ECS staging deployment."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_ECS_STAGING_REGION }}

      - name: Login to ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_ECS_STAGING_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Run migration against Neon
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::8}"
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}/knowhere-backend:staging-${short_sha}"
          docker run --rm \
            --env DATABASE_URL \
            --env DB_SSL_MODE=require \
            --entrypoint python \
            "$image_uri" \
            -m alembic upgrade heads

  migrate-eks-staging:
    name: Run EKS rollback database migration
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deployment_target == 'eks-staging-rollback' &&
      (github.event.inputs.service == '' ||
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'api') }}
    permissions:
      contents: read

    steps:
      - name: Decide migration context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::8}"
          echo "namespace=knowhere-staging" >> "$GITHUB_OUTPUT"
          echo "image_uri=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}/knowhere-backend:staging-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || \
             [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] || \
             [ -z "${{ env.AWS_EKS_PROD_CLUSTER_NAME }}" ] || \
             [ -z "${{ env.AWS_EKS_PROD_REGION }}" ]; then
            echo "::error::EKS rollback migration requires AWS deployment credentials and cluster configuration."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_EKS_PROD_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --name "${AWS_EKS_PROD_CLUSTER_NAME}" \
            --region "${AWS_EKS_PROD_REGION}"

      - name: Run migration job
        shell: bash
        env:
          IMAGE_URI: ${{ steps.context.outputs.image_uri }}
          NAMESPACE: ${{ steps.context.outputs.namespace }}
        run: |
          set -euo pipefail

          job_name="knowhere-api-migrate-${GITHUB_RUN_ID}"
          migration_manifest="$(kubectl get deployment/knowhere-api --namespace "$NAMESPACE" -o json \
            | jq --arg job_name "$job_name" --arg image_uri "$IMAGE_URI" '
                if ((.spec.template.spec.containers // []) | length) == 0 then
                  error("knowhere-api deployment has no containers")
                else
                {
                  apiVersion: "batch/v1",
                  kind: "Job",
                  metadata: {name: $job_name, namespace: .metadata.namespace},
                  spec: {
                    backoffLimit: 0,
                    ttlSecondsAfterFinished: 300,
                    template: {
                      metadata: {labels: {"app": "knowhere-api-migrate"}},
                      spec: (
                        .spec.template.spec
                        | .restartPolicy = "Never"
                        | .containers[0].image = $image_uri
                        | .containers[0].command = ["python", "-m", "alembic", "upgrade", "heads"]
                        | del(.containers[0].args)
                      )
                    }
                  }
                }
                end
              ')"

          printf '%s\n' "$migration_manifest" | kubectl apply -f -
          if ! kubectl wait --for=condition=complete "job/$job_name" --namespace "$NAMESPACE" --timeout=900s; then
            kubectl describe job "$job_name" --namespace "$NAMESPACE" || true
            kubectl logs "job/$job_name" --namespace "$NAMESPACE" --all-containers=true || true
            exit 1
          fi
          kubectl delete job "$job_name" --namespace "$NAMESPACE" --ignore-not-found

  deploy-ecs-staging:
    name: Deploy staging services to ECS
    runs-on: ubuntu-latest
    needs: [build-and-publish, migrate-ecs-staging]
    if: >-
      ${{ always() && needs.build-and-publish.result == 'success' &&
      (needs['migrate-ecs-staging'].result == 'success' || needs['migrate-ecs-staging'].result == 'skipped') &&
      ((github.ref == 'refs/heads/staging' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deployment_target == 'ecs-staging')) }}
    permissions:
      contents: read

    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Decide ECS services to update
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          selected_service="${{ github.event.inputs.service }}"
          if [ "${{ github.event_name }}" = "push" ] || [ -z "$selected_service" ] || [ "$selected_service" = "all" ]; then
            deploy_api="true"
            deploy_worker="true"
          elif [ "$selected_service" = "api" ]; then
            deploy_api="true"
            deploy_worker="false"
          elif [ "$selected_service" = "worker" ]; then
            deploy_api="false"
            deploy_worker="true"
          else
            echo "::error::Unsupported ECS staging service selection: ${selected_service}"
            exit 1
          fi
          echo "deploy_api=$deploy_api" >> "$GITHUB_OUTPUT"
          echo "deploy_worker=$deploy_worker" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_ECS_STAGING_REGION }}

      - name: Validate ECS staging prerequisites
        shell: bash
        env:
          STAGING_SECRETS_ARN: ${{ env.AWS_ECS_STAGING_SECRETS_ARN }}
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "::error::ECS staging deployment requires AWS deployment credentials."
            exit 1
          fi
          if [ -z "$STAGING_SECRETS_ARN" ]; then
            echo "::error::AWS_ECS_STAGING_SECRETS_ARN is not configured. Create and approve the staging runtime secret before deploying ECS."
            exit 1
          fi

          cluster_status="$(aws ecs describe-clusters \
            --clusters "${AWS_ECS_STAGING_CLUSTER_NAME}" \
            --query 'clusters[0].status' --output text)"
          if [ "$cluster_status" != "ACTIVE" ]; then
            echo "::error::ECS cluster ${AWS_ECS_STAGING_CLUSTER_NAME} is not ACTIVE (status: ${cluster_status})."
            exit 1
          fi

          for role_arn in \
            "${AWS_ECS_STAGING_EXECUTION_ROLE_ARN}" \
            "${AWS_ECS_STAGING_API_TASK_ROLE_ARN}" \
            "${AWS_ECS_STAGING_WORKER_TASK_ROLE_ARN}"; do
            aws iam get-role --role-name "${role_arn##*/}" --query 'Role.Arn' --output text >/dev/null
          done

          aws secretsmanager describe-secret \
            --secret-id "$STAGING_SECRETS_ARN" \
            --query 'ARN' --output text >/dev/null

          for log_group in /ecs/knowhere-api-staging /ecs/knowhere-worker-staging; do
            found="$(aws logs describe-log-groups \
              --log-group-name "$log_group" \
              --query 'logGroups[0].logGroupName' --output text)"
            if [ "$found" != "$log_group" ]; then
              echo "::error::Required CloudWatch log group ${log_group} does not exist."
              exit 1
            fi
          done

          services=""
          if [ "${{ steps.deployment.outputs.deploy_api }}" = "true" ]; then
            services="${AWS_ECS_STAGING_API_SERVICE_NAME}"
          fi
          if [ "${{ steps.deployment.outputs.deploy_worker }}" = "true" ]; then
            services="${services} ${AWS_ECS_STAGING_WORKER_SERVICE_NAME}"
          fi
          for service in $services; do
            service_json="$(aws ecs describe-services \
              --cluster "${AWS_ECS_STAGING_CLUSTER_NAME}" \
              --services "$service" --output json)"
            status="$(jq -r '.services[0].status // "MISSING"' <<<"$service_json")"
            if [ "$status" != "ACTIVE" ]; then
              echo "::error::Required ECS service ${service} is not ACTIVE (status: ${status}). Create it before deploying."
              exit 1
            fi
            network_count="$(jq '[.services[0].networkConfiguration.awsvpcConfiguration.subnets // [] | length] | add' <<<"$service_json")"
            security_group_count="$(jq '[.services[0].networkConfiguration.awsvpcConfiguration.securityGroups // [] | length] | add' <<<"$service_json")"
            if [ "$network_count" -lt 1 ] || [ "$security_group_count" -lt 1 ]; then
              echo "::error::ECS service ${service} has no usable awsvpc subnet/security-group configuration."
              exit 1
            fi
          done

          if [ "${{ steps.deployment.outputs.deploy_api }}" = "true" ]; then
            api_load_balancer_count="$(aws ecs describe-services \
              --cluster "${AWS_ECS_STAGING_CLUSTER_NAME}" \
              --services "${AWS_ECS_STAGING_API_SERVICE_NAME}" \
              --query 'length(services[0].loadBalancers)' --output text)"
            if [ "$api_load_balancer_count" -lt 1 ]; then
              echo "::error::API ECS service has no load balancer target configured."
              exit 1
            fi
          fi

      - name: Resolve immutable ECR image digests
        id: images
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::8}"
          image_tag="staging-${short_sha}"

          resolve_image() {
            local repository="$1"
            local output_name="$2"
            local digest
            digest="$(aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}/${repository}" \
              --image-ids "imageTag=${image_tag}" \
              --query 'imageDetails[0].imageDigest' --output text)"
            if [ -z "$digest" ] || [ "$digest" = "None" ]; then
              echo "::error::No ECR image found for ${repository}:${image_tag}."
              exit 1
            fi
            echo "${output_name}=${ECR_REGISTRY}/${ECR_REPOSITORY}/${repository}@${digest}" >> "$GITHUB_OUTPUT"
          }

          resolve_image knowhere-backend api_image
          resolve_image knowhere-worker worker_image

      - name: Render ECS task definitions
        env:
          API_IMAGE: ${{ steps.images.outputs.api_image }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker_image }}
          EXECUTION_ROLE_ARN: ${{ env.AWS_ECS_STAGING_EXECUTION_ROLE_ARN }}
          API_TASK_ROLE_ARN: ${{ env.AWS_ECS_STAGING_API_TASK_ROLE_ARN }}
          WORKER_TASK_ROLE_ARN: ${{ env.AWS_ECS_STAGING_WORKER_TASK_ROLE_ARN }}
          STAGING_SECRETS_ARN: ${{ env.AWS_ECS_STAGING_SECRETS_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/ecs/render_task_definitions.py --output-dir "$RUNNER_TEMP/ecs-task-definitions"

      - name: Register ECS task definitions
        id: task-definitions
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.deployment.outputs.deploy_api }}" = "true" ]; then
            api_task_definition_arn="$(aws ecs register-task-definition \
              --cli-input-json "file://${RUNNER_TEMP}/ecs-task-definitions/knowhere-api-staging.json" \
              --query 'taskDefinition.taskDefinitionArn' --output text)"
            echo "api_task_definition_arn=${api_task_definition_arn}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ steps.deployment.outputs.deploy_worker }}" = "true" ]; then
            worker_task_definition_arn="$(aws ecs register-task-definition \
              --cli-input-json "file://${RUNNER_TEMP}/ecs-task-definitions/knowhere-worker-staging.json" \
              --query 'taskDefinition.taskDefinitionArn' --output text)"
            echo "worker_task_definition_arn=${worker_task_definition_arn}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update API ECS service on on-demand Fargate
        if: steps.deployment.outputs.deploy_api == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${AWS_ECS_STAGING_CLUSTER_NAME}" \
            --service "${AWS_ECS_STAGING_API_SERVICE_NAME}" \
            --task-definition "${{ steps.task-definitions.outputs.api_task_definition_arn }}" \
            --capacity-provider-strategy capacityProvider=FARGATE,weight=1

      - name: Update worker ECS service on Fargate Spot
        if: steps.deployment.outputs.deploy_worker == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${AWS_ECS_STAGING_CLUSTER_NAME}" \
            --service "${AWS_ECS_STAGING_WORKER_SERVICE_NAME}" \
            --task-definition "${{ steps.task-definitions.outputs.worker_task_definition_arn }}" \
            --capacity-provider-strategy capacityProvider=FARGATE_SPOT,weight=1

      - name: Wait for API ECS service to stabilize
        if: steps.deployment.outputs.deploy_api == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "${AWS_ECS_STAGING_CLUSTER_NAME}" \
            --services "${AWS_ECS_STAGING_API_SERVICE_NAME}"

      - name: Wait for worker ECS service to stabilize
        if: steps.deployment.outputs.deploy_worker == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "${AWS_ECS_STAGING_CLUSTER_NAME}" \
            --services "${AWS_ECS_STAGING_WORKER_SERVICE_NAME}"

      - name: Summarize ECS deployment
        shell: bash
        run: |
          echo "Environment: staging"
          echo "Cluster: ${AWS_ECS_STAGING_CLUSTER_NAME}"
          echo "API image: ${{ steps.images.outputs.api_image }}"
          echo "Worker image: ${{ steps.images.outputs.worker_image }}"

  deploy-eks:
    runs-on: ubuntu-latest
    needs: [build-and-publish, migrate-eks-staging]
    if: >-
      ${{ always() && github.event_name != 'pull_request' &&
      needs.build-and-publish.result == 'success' &&
      (needs['migrate-eks-staging'].result == 'success' || needs['migrate-eks-staging'].result == 'skipped') &&
      (github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deployment_target == 'eks-staging-rollback')) }}
    permissions:
      contents: read

    strategy:
      matrix:
        service: [api, worker]
        include:
          - service: api
            ecr_repo_name: knowhere-backend
          - service: worker
            ecr_repo_name: knowhere-worker

    steps:
      - name: Decide deployment context
        id: context
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            environment="staging"
          elif [ "${{ github.event_name }}" = "release" ]; then
            environment="prod"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            environment="prod"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            environment="staging"
          else
            environment="staging"
            should_deploy="false"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.service }}" ] && [ "${{ github.event.inputs.service }}" != "all" ] && [ "${{ github.event.inputs.service }}" != "${{ matrix.service }}" ]; then
            should_deploy="false"
          elif [ -z "${should_deploy:-}" ]; then
            should_deploy="true"
          fi

          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || \
             [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] || \
             [ -z "${{ env.AWS_EKS_PROD_CLUSTER_NAME }}" ] || \
             [ -z "${{ env.AWS_EKS_PROD_REGION }}" ]; then
            if [ "$environment" = "prod" ] && [ "$should_deploy" = "true" ]; then
              echo "::error::Production deployment credentials are not configured."
              exit 1
            fi
            should_deploy="false"
          fi

          if [ "$environment" = "prod" ]; then
            namespace="knowhere-prod"
          else
            namespace="knowhere-staging"
          fi

          short_sha="${GITHUB_SHA::8}"
          if [ "${{ github.event_name }}" = "release" ]; then
            git_tag="${{ github.event.release.tag_name }}"
            image_tag="${git_tag}-${environment}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            git_tag="${GITHUB_REF#refs/tags/}"
            image_tag="${git_tag}-${environment}"
          else
            image_tag="${environment}-${short_sha}"
          fi

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          echo "image_uri=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}/${{ matrix.ecr_repo_name }}:${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.context.outputs.should_deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_EKS_PROD_REGION }}

      - name: Update kubeconfig
        if: steps.context.outputs.should_deploy == 'true'
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.AWS_EKS_PROD_CLUSTER_NAME }}" \
            --region "${{ env.AWS_EKS_PROD_REGION }}"

      - name: Roll out service on AWS EKS
        if: steps.context.outputs.should_deploy == 'true'
        shell: bash
        run: |
          deployment_name="knowhere-${{ matrix.service }}"
          container_name="${{ matrix.service }}"
          namespace="${{ steps.context.outputs.namespace }}"
          image_uri="${{ steps.context.outputs.image_uri }}"

          echo "Deploying ${deployment_name} to ${namespace} with ${image_uri}"

          kubectl set image "deployment/${deployment_name}" \
            "${container_name}=${image_uri}" \
            --namespace "${namespace}"

          if [ "${{ matrix.service }}" = "worker" ]; then
            kubectl patch "deployment/${deployment_name}" \
              --namespace "${namespace}" \
              --type='strategic' \
              -p='{"spec":{"template":{"spec":{"containers":[{"name":"worker","readinessProbe":{"exec":{"command":["python","-c","from shared.services.worker_health import assert_worker_healthy; assert_worker_healthy()"]}},"livenessProbe":{"exec":{"command":["python","-c","from shared.services.worker_health import assert_worker_healthy; assert_worker_healthy()"]}}}]}}}}'
          fi

          kubectl rollout status "deployment/${deployment_name}" \
            --namespace "${namespace}" \
            --timeout=300s

      - name: Summarize deployment
        if: steps.context.outputs.should_deploy == 'true'
        shell: bash
        run: |
          echo "Service: ${{ matrix.service }}"
          echo "Environment: ${{ steps.context.outputs.environment }}"
          echo "Namespace: ${{ steps.context.outputs.namespace }}"
          echo "Image: ${{ steps.context.outputs.image_uri }}"

  release:
    name: Attach deployment release assets
    runs-on: ubuntu-latest
    needs: deploy-eks
    if: >-
      ${{ github.event_name == 'release' &&
      github.event.action == 'published' }}
    permissions:
      contents: write
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ github.event.release.tag_name }}"
          deployed_sha="$(git rev-parse HEAD)"

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "deployed_sha=${deployed_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create source archive
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          DEPLOYED_SHA: ${{ steps.release.outputs.deployed_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          git archive --format=zip --output="release-assets/knowhere-api-${RELEASE_TAG}-source.zip" "${DEPLOYED_SHA}"

          cat > release-assets/build-info.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "release_tag": "${RELEASE_TAG}",
            "deployed_commit": "${DEPLOYED_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "${RELEASE_TAG}" \
            release-assets/knowhere-api-${RELEASE_TAG}-source.zip \
            release-assets/build-info.json \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
